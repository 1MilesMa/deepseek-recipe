name: build-deepseek-recipe-wheel

# Manual trigger: Actions -> build-deepseek-recipe-wheel -> Run workflow.
# This fork builds WITHOUT OpenCV, so image preprocessing is unavailable;
# protocol conversion, prompt rendering and tokenizer work normally.
on:
  workflow_dispatch:

jobs:
  wheel:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Build wheel with maturin
        shell: pwsh
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist --manifest-path deepseek-recipe-python/Cargo.toml

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem dist -Recurse | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-recipe-windows
          path: dist/*.whl
          if-no-files-found: error
